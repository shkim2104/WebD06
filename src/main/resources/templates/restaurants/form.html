<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>맛집 등록</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/css/my.css}" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" th:href="@{/restaurants}">🍽 맛집 관리</a>
  </div>
</nav>

<main class="container py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <h1 class="h3 mb-3">새 맛집 등록</h1>

      <div class="card shadow-sm">
        <div class="card-body">
          <!-- POST /restaurants 로 전송, name 은 RestaurantRequest 필드명과 동일 -->
          <form th:action="@{/restaurants}" method="post">
            <div class="mb-3">
              <label for="name" class="form-label">상호명</label>
              <input type="text" class="form-control" id="name" name="name" placeholder="예) 홍길동 식당" required>
            </div>

            <div class="mb-3">
              <label for="location" class="form-label">도로명 주소</label>
              <input type="text" class="form-control" id="location" name="location" placeholder="예) 서울 강남구" required>
            </div>

            <div class="mb-3">
              <label for="rating" class="form-label">평점 (0 ~ 5)</label>
              <input type="number" class="form-control" id="rating" name="rating"
                     step="0.1" min="0" max="5" placeholder="예) 4.5" required>
            </div>

            <div class="mb-3">
              <label for="mainMenu" class="form-label">대표 메뉴</label>
              <input type="text" class="form-control" id="mainMenu" name="mainMenu" placeholder="예) 김치찌개" required>
            </div>

            <div class="mb-4">
              <label for="category" class="form-label">카테고리</label>
              <select class="form-select" id="category" name="category" required>
                <option value="" selected disabled>선택하세요</option>
                <option value="한식">한식</option>
                <option value="중식">중식</option>
                <option value="일식">일식</option>
                <option value="양식">양식</option>
                <option value="기타">기타</option>
              </select>
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary">등록</button>
              <a class="btn btn-outline-secondary" th:href="@{/restaurants}">목록으로</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>

</body>
</html>
