<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>맛집 목록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/restaurants}">🍽 맛집 관리</a>
    </div>
</nav>

<main class="container py-4">
    <!-- 페이지 제목 + 신규 등록 버튼 -->
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h3 mb-0">맛집 목록</h1>
        <a class="btn btn-primary" th:href="@{/restaurants/new}">+ 새 맛집 등록</a>
    </div>

    <!-- 데이터 목록 Table (화면이 좁으면 가로 스크롤) -->
    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>이름</th>
                    <th>위치</th>
                    <th>평점</th>
                    <th>대표 메뉴</th>
                    <th>카테고리</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="restaurant : ${restaurants}">
                    <td th:text="${restaurant.id}">1</td>
                    <td th:text="${restaurant.name}">맛집 이름</td>
                    <td th:text="${restaurant.location}">서울</td>
                    <td th:text="${restaurant.rating}">4.5</td>
                    <td th:text="${restaurant.mainMenu}">김치찌개</td>
                    <td><span class="badge text-bg-secondary" th:text="${restaurant.category}">한식</span></td>
                </tr>
                <!-- 데이터가 없을 때 -->
                <tr th:if="${#lists.isEmpty(restaurants)}">
                    <td colspan="6" class="text-center text-muted py-4">등록된 맛집이 없습니다.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

</body>
</html>
